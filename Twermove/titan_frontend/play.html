<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWERMOVE — Dialogue Test</title>
  <link rel="stylesheet" href="static/style.css" />
  <style>
    /* ── Test harness UI — chỉ dùng trong dev ── */
    #test-panel {
      position: fixed;
      bottom: 16px; right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 220px;
      opacity: 0.92;
    }

    .test-label {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(232,32,32,0.4);
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(232,32,32,0.12);
    }

    .test-btn {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      padding: 7px 10px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(232,32,32,0.25);
      color: rgba(232,32,32,0.7);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.1s, color 0.1s;
      text-transform: uppercase;
    }

    .test-btn:hover {
      border-color: rgba(232,32,32,0.7);
      color: #fff;
    }

    .test-btn.white-btn {
      border-color: rgba(100,180,255,0.25);
      color: rgba(100,180,255,0.7);
    }

    .test-btn.white-btn:hover {
      border-color: rgba(100,180,255,0.8);
      color: #fff;
    }

    .test-btn.toggle-btn.active {
      background: rgba(100,180,255,0.1);
      border-color: rgba(100,180,255,0.6);
      color: rgba(100,180,255,0.9);
    }

    /* Trạng thái engine */
    #engine-status {
      font-family: 'Space Mono', monospace;
      font-size: 7px;
      letter-spacing: 2px;
      color: rgba(232,32,32,0.3);
      text-align: right;
      margin-top: 2px;
    }

    #engine-status.ready { color: rgba(0,255,136,0.5); }
  </style>
</head>
<body>

  <!-- Atmosphere layers (same as Main Menu) -->
  <div class="vignette"          aria-hidden="true"></div>
  <div class="system-tear-slice" aria-hidden="true"></div>
  <svg style="display:none;" aria-hidden="true">
    <filter id="titan-static" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </svg>
  <div class="static-noise"  aria-hidden="true"></div>
  <div class="crt-scanlines" aria-hidden="true"></div>
  <div id="chaos-container"  aria-hidden="true"></div>
  <div id="flash-container"  aria-live="polite"></div>

  <!-- Test Panel -->
  <nav id="test-panel" aria-label="Dialogue test controls">
    <div class="test-label">Dialogue Engine Test</div>

    <!-- HỒI 1 Triggers -->
    <div class="test-label">Hồi 1</div>
    <button class="test-btn" onclick="DialogueEngine.trigger('boot_sequence')">⚙ boot_sequence</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('near_phantom')">👁 near_phantom</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('quarantine_stealth', 1)">💧 quarantine_stealth [!]</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('near_scavenger', 1)">☠ near_scavenger [!]</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('near_erasure', 1)">◼ near_erasure [!]</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('hp_low')">💔 hp_low</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('energy_below_20')">⚡ energy_below_20</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('standing_still_5s')">⏸ standing_still_5s</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('eyes_closed_long')">🌑 eyes_closed_long</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('found_memory_core')">🔮 found_memory_core</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('compass_active')">🧭 compass_active</button>

    <!-- HỒI 2 Triggers -->
    <div class="test-label" style="margin-top:6px;">Hồi 2</div>
    <button class="test-btn" onclick="DialogueEngine.trigger('echo_interrupt')">🔄 echo_interrupt</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('boss_wave_incoming', 1)">🌊 boss_wave [!]</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('boss_downtime')">💨 boss_downtime</button>
    <button class="test-btn" onclick="DialogueEngine.trigger('generic')">◈ generic</button>

    <!-- Specific IDs -->
    <div class="test-label" style="margin-top:6px;">Specific ID</div>
    <button class="test-btn white-btn" onclick="DialogueEngine.fire('DIA_W_BOOT_01')">DIA_W_BOOT_01</button>
    <button class="test-btn" onclick="DialogueEngine.fire('DIA_R_PHANTOM_02')">DIA_R_PHANTOM_02</button>
    <button class="test-btn" onclick="DialogueEngine.fire('DIA_R_ERASE_01')">DIA_R_ERASE_01</button>
    <button class="test-btn" onclick="DialogueEngine.fire('DIA_R_BOSS_01')">DIA_R_BOSS_01</button>

    <!-- Eyes closed toggle -->
    <div class="test-label" style="margin-top:6px;">State</div>
    <button class="test-btn toggle-btn" id="eyesBtn"
      onclick="toggleEyes()">[ SPACE ] Eyes: OPEN</button>

    <div id="engine-status">ENGINE: LOADING…</div>
  </nav>

  <script>
    // Eyes toggle (simulates hold Space)
    let eyesClosed = false;
    function toggleEyes() {
      eyesClosed = !eyesClosed;
      DialogueEngine.setSuppressRed(eyesClosed);
      const btn = document.getElementById('eyesBtn');
      btn.textContent = `[ SPACE ] Eyes: ${eyesClosed ? 'CLOSED' : 'OPEN'}`;
      btn.classList.toggle('active', eyesClosed);
    }

    // Keyboard Space simulation
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && !eyesClosed) {
        e.preventDefault();
        eyesClosed = true;
        DialogueEngine.setSuppressRed(true);
        document.getElementById('eyesBtn').textContent = '[ SPACE ] Eyes: CLOSED';
        document.getElementById('eyesBtn').classList.add('active');
      }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'Space' && eyesClosed) {
        eyesClosed = false;
        DialogueEngine.setSuppressRed(false);
        document.getElementById('eyesBtn').textContent = '[ SPACE ] Eyes: OPEN';
        document.getElementById('eyesBtn').classList.remove('active');
      }
    });
  </script>

  <!-- Scripts -->
  <script src="static/atmosphere.js"></script>
  <script src="static/dialogue.js"></script>
  <script>
    // Boot dialogue engine and update status
    DialogueEngine.init().then(() => {
      const st = document.getElementById('engine-status');
      if (DialogueEngine.ready) {
        st.textContent = 'ENGINE: ONLINE';
        st.classList.add('ready');
      } else {
        st.textContent = 'ENGINE: FAILED';
      }
    });
  </script>

</body>
</html>
