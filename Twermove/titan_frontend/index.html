<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TWERMOVE</title>
  <meta name="description" content="TWERMOVE — a trauma-core survival experience." />
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>

  <div class="vent-bg" id="ventBg" aria-hidden="true"></div>
  <div class="vignette"          aria-hidden="true"></div>
  <div class="system-tear-slice" aria-hidden="true"></div>

  <svg style="display:none;" aria-hidden="true">
    <filter id="titan-static" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </svg>

  <div class="static-noise"   aria-hidden="true"></div>
  <div class="crt-scanlines"  aria-hidden="true"></div>
  <div id="chaos-container"   aria-hidden="true"></div>
  <div id="flash-container"   aria-live="polite"></div>
  <div id="transition-veil"   aria-hidden="true"></div>

  <nav class="menu-actions" aria-label="Main menu">
    <a href="#" class="metal-btn"           id="btnStart">Initialize_Run</a>
    <a href="#" class="metal-btn secondary" id="btnSettings">System_Config</a>
  </nav>

  <p style="position:fixed;bottom:85px;width:100%;text-align:center;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px;z-index:200;">
    CONTENT WARNING: Themes of despair, emotional breakdown, and self-harm-adjacent language.
  </p>

  <footer class="index-footer" aria-label="System info">
    <span>TWERMOVE v0.1.0 // BACKEND_LINK: 127.0.0.1:8000</span>
    <span id="sysTime">&#8212;</span>
    <span>SEQUENCE_ENGINE: STANDBY</span>
  </footer>

  <script>
    // Live clock
    (function clock() {
      const el = document.getElementById('sysTime');
      function tick() {
        const now = new Date();
        el.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
      }
      tick();
      setInterval(tick, 1000);
    })();

    // Buttons — placeholder until game routes exist
    document.getElementById('btnStart').addEventListener('click', function(e) {
      e.preventDefault();
      // TODO: route to game when ready
      this.textContent = 'SEQUENCE_PENDING…';
      this.classList.add('processing');
      setTimeout(() => {
        this.textContent = 'Initialize_Run';
        this.classList.remove('processing');
      }, 2000);
    });

    document.getElementById('btnSettings').addEventListener('click', function(e) {
      e.preventDefault();
      // TODO: route to settings when ready
    });
  </script>

  <script src="static/atmosphere.js"></script>
</body>
</html>
